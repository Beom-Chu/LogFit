services:
  db:
    image: postgres:16-alpine
    container_name: logfit-db
    environment:
      POSTGRES_DB: logfit
      POSTGRES_USER: logfit
      POSTGRES_PASSWORD: logfit1234
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logfit -d logfit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logfit-backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: logfit
      DB_USERNAME: logfit
      DB_PASSWORD: logfit1234
      JWT_SECRET: ${JWT_SECRET:-logfit-super-secret-key-for-jwt-signing-must-be-at-least-256-bits-long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logfit-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
