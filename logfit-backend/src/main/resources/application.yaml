spring:
  application:
    name: logfit-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/logfit
    driverClassName: org.postgresql.Driver
    username: logfit
    password: logfit123
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
