spring:
  application:
    name: logfit-backend
  profiles:
    active: supabase   # 로컬 DB 사용 시: local / Supabase 사용 시: supabase
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: your-super-secret-key-minimum-256-bits-long-for-hs256-algorithm-please-change-this
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

---
# ==============================
# 로컬 Docker PostgreSQL
# ==============================
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/logfit
    driver-class-name: org.postgresql.Driver
    username: logfit
    password: logfit123

---
# ==============================
# Supabase PostgreSQL
# Supabase 대시보드 > Settings > Database > JDBC Connection string 참고
# ==============================
spring:
  config:
    activate:
      on-profile: supabase
  datasource:
    url: jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
    driver-class-name: org.postgresql.Driver
    username: logfit.lxiuscztoxwgafkdtkdv
    password: logfit123

---
# ==============================
# H2 In-Memory Database
# 개발/테스트용 인메모리 DB
# ==============================
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:logfit
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop


