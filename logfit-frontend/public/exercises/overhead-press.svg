<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title">
  <title id="title">Overhead Press</title>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d5c8" />
      <stop offset="100%" stop-color="#e8b8ad" />
    </linearGradient>
    <linearGradient id="shoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" />
      <stop offset="100%" stop-color="#c0392b" />
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d35400" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#f5f7fa" />
  <!-- 바벨 (위) -->
  <rect x="380" y="180" width="440" height="28" rx="14" fill="#4a4a4a" />
  <circle cx="360" cy="194" r="36" fill="#2a2a2a" />
  <circle cx="840" cy="194" r="36" fill="#2a2a2a" />
  <!-- 발 -->
  <ellipse cx="480" cy="750" rx="32" ry="38" fill="#3a3a3a" />
  <ellipse cx="720" cy="750" rx="32" ry="38" fill="#3a3a3a" />
  <!-- 다리 -->
  <line x1="520" y1="530" x2="480" y2="750" stroke="url(#arm)" stroke-width="34" stroke-linecap="round" />
  <line x1="680" y1="530" x2="720" y2="750" stroke="url(#arm)" stroke-width="34" stroke-linecap="round" />
  <!-- 상체 -->
  <ellipse cx="600" cy="440" rx="130" ry="90" fill="url(#skin)" stroke="#8b7355" stroke-width="2" />
  <!-- 어깨 근육 (강조) -->
  <ellipse cx="480" cy="380" rx="50" ry="65" fill="url(#shoulder)" stroke="#b8270d" stroke-width="1.5" />
  <ellipse cx="720" cy="380" rx="50" ry="65" fill="url(#shoulder)" stroke="#b8270d" stroke-width="1.5" />
  <!-- 목 -->
  <rect x="570" y="330" width="60" height="55" rx="18" fill="url(#skin)" stroke="#8b7355" stroke-width="1.5" />
  <!-- 머리 -->
  <circle cx="600" cy="250" r="50" fill="url(#skin)" stroke="#8b7355" stroke-width="2" />
  <!-- 팔 (들어올린 상태) -->
  <line x1="480" y1="370" x2="420" y2="200" stroke="url(#arm)" stroke-width="34" stroke-linecap="round" />
  <circle cx="420" cy="200" r="26" fill="url(#skin)" stroke="#8b7355" stroke-width="1.5" />
  <line x1="720" y1="370" x2="780" y2="200" stroke="url(#arm)" stroke-width="34" stroke-linecap="round" />
  <circle cx="780" cy="200" r="26" fill="url(#skin)" stroke="#8b7355" stroke-width="1.5" />
  <text x="600" y="120" text-anchor="middle" font-size="64" font-family="Arial, sans-serif" fill="#1a1a1a" font-weight="700">Overhead Press</text>
</svg>

